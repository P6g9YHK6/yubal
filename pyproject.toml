[project]
name = "yubal-workspace"
version = "0.10.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
yubal = { workspace = true }
# pinned for the get_artist promo carousel fix (sigma67/ytmusicapi#1031), drop once released
ytmusicapi = { git = "https://github.com/sigma67/ytmusicapi", rev = "86fcd17ee3ff0d19bc807558d4e1a637df395143" }

[dependency-groups]
dev = [
    "ruff>=0.14.11",
    "ty>=0.0.11",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-socket>=0.7.0",
    "pytest-asyncio>=1.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "RUF", "ANN"]
ignore = ["ANN401"]                                    # Allow Any for pydantic validators

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]
addopts = "--tb=short --disable-socket"
